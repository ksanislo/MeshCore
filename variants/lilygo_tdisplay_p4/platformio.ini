# LilyGo T-Display-P4 AMOLED (ESP32-P4) -- EXPERIMENTAL platform port.
# See ESP32P4-TDISPLAY-PORT-SCOPING.md. Milestone 1a = toolchain + RadioLib + companion COMPILE
# (LoRa-only, USB companion, no display/BLE/WiFi). The SX1262's RST/DIO1 are on the XL9535 I2C
# expander, NOT native GPIOs -- placeholdered as -1 here so RadioLib's Module compiles; the real
# expander-backed radio HAL is milestone 1b (target.cpp TODO).
[LilyGo_TDisplay_P4]
extends = esp32p4_base
board = lilygo-tdisplay-p4          ; custom (boards/lilygo-tdisplay-p4.json): HEX PSRAM + 120MHz flash
board_build.partitions = variants/lilygo_tdisplay_p4/partitions.csv
; pioarduino "HybridCompile": with custom_sdkconfig set (framework stays = arduino), IDF + arduino-esp32
; are recompiled FROM SOURCE with these keys merged in -- the ONLY way to express this board's HEX-mode
; PSRAM, which the prebuilt Arduino libs can't (and which hangs the stock bootloader). Matches Meck-P4's
; proven sdkconfig. First build is slow (compiles IDF from source). See ESP32P4-TDISPLAY-PORT-SCOPING.md.
custom_sdkconfig =
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  CONFIG_ESPTOOLPY_FLASHFREQ_120M=y
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_HEX=y
  CONFIG_SPIRAM_SPEED_200M=y
  CONFIG_CACHE_L2_CACHE_256KB=y
  CONFIG_CACHE_L2_CACHE_LINE_128B=y
  ; arduino base sets FMB_MASTER_TIMEOUT_MS_RESPOND=10000 but leaves the blocking time at 6000,
  ; tripping esp-modbus's build assertion (blocking >= timeout). Bump it to clear the from-source build.
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
build_flags =
  ${esp32p4_base.build_flags}
  -I variants/lilygo_tdisplay_p4
  -D LILYGO_TDISPLAY_P4
  ; Bring-up console over the USB-Serial/JTAG peripheral (mode 1) -- it's on the plugged USB-C port
  ; (our download-mode flashing proved it) and needs no TinyUSB sdkconfig. Switch to TinyUSB CDC
  ; (mode 0 + CONFIG_TINYUSB_CDC_ENABLED) later for the phone-companion data port.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; --- SX1262 on SPI host "SPI_1" (native GPIOs) ---
  -D P_LORA_NSS=24
  -D P_LORA_BUSY=6
  -D P_LORA_SCLK=2
  -D P_LORA_MISO=4
  -D P_LORA_MOSI=3
  ; --- RST + DIO1 live on the XL9535 I2C expander (IO16 / IO17), NOT native pins. ---
  ; Placeholdered -1 (RADIOLIB_NC) so Module compiles; wired via the expander HAL in milestone 1b.
  -D P_LORA_RESET=-1
  -D P_LORA_DIO_1=-1
  -D ENV_INCLUDE_GPS=0

; Minimal USB-CDC sanity build (no MeshCore) for P4 bring-up -- see usbtest.cpp.
[env:LilyGo_TDisplay_P4_usbtest]
extends = LilyGo_TDisplay_P4
; Minimal USB console test. OPEN ISSUE: with custom_sdkconfig, pioarduino's HybridCompile injects a
; .dummy "Hello World" sketch (its own setup/loop) as PROJECT_SRC_DIR to rebuild the libs from source;
; our build_src_filter (external ../ sources) then links usbtest.cpp alongside it -> duplicate
; setup/loop. Resolution TBD: either tame the HybridCompile two-pass, or move this variant to
; framework=arduino,espidf (explicit CMake SRCS, no build_src_filter). See scoping doc M2.
build_src_filter =
  -<*>
  +<../variants/lilygo_tdisplay_p4/usbtest.cpp>
lib_deps =

[env:LilyGo_TDisplay_P4_companion_radio_usb]
extends = LilyGo_TDisplay_P4
build_flags =
  ${LilyGo_TDisplay_P4.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter =
  ${LilyGo_TDisplay_P4.build_src_filter}
  +<../variants/lilygo_tdisplay_p4>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${esp32p4_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
