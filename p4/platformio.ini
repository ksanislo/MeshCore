; Dedicated ESP-IDF project for ESP32-P4 touch-panel boards (LilyGo T-Display-P4, future CrowPanel-P4).
; Kept SEPARATE from the repo's main platformio.ini (S3 boards) so the CMake/espidf project structure
; doesn't disturb the prebuilt-Arduino S3 builds. This project vendors MeshCore's radio core (../src)
; and our shared UI, and builds them from source with a board-correct sdkconfig (HEX PSRAM).
; See ../ESP32P4-TDISPLAY-PORT-SCOPING.md.  Build: pio run -d p4 -e tdisplay_p4
[platformio]
boards_dir = ../boards
src_dir = main

[env:tdisplay_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = lilygo-tdisplay-p4
; M2: pure espidf, console over a hand-rolled TinyUSB CDC (esp_tinyusb) -- the board's proven USB path
; (mirrors Meck-P4's Hardware_Usb_Cdc_Init). Arduino gets re-added in M3 once boot+console are confirmed.
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
